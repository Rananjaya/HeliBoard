# SPDX-License-Identifier: GPL-3.0-only
# Checks pull requests to develop. Read-only: no secrets, no signing, no releases.
# Also called by development.yml (workflow_call) to run the same checks on an exact commit.
# See docs/ci-cd.md.
name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Exact commit SHA to check out and test
        type: string
        required: true
      skip_debug_build:
        description: Skip the "Debug build" job (the caller builds the debug APK itself)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs called from Development get their
# own group (the caller's run id), so they never cancel each other or a pull request run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108"

jobs:
  release-scripts:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Test release and stage scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # The runTests build type skips tests that already fail upstream. AGP 9 only creates unit test
      # tasks for the tested build type (debug) unless the flag is set. The init script leaves out
      # XLinkTest, which checks external web links over the network.
      - name: Run unit tests
        run: >-
          ./gradlew --init-script .github/ci-unit-tests.init.gradle :app:testRunTestsUnitTest
          -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

  native-tests:
    name: Native tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }} (for jni.h)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install clang and GoogleTest
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang libgtest-dev

      # Skips the known upstream failures listed in known_upstream_failures.txt.
      - name: Run native tests
        env:
          GTEST_PREFIX: /usr
        run: app/src/main/jni/tests/host/run_host_tests.sh

  debug-build:
    name: Debug build
    # true for pull requests (input not set); development.yml skips it because it builds the
    # same debug APK itself
    if: ${{ !inputs.skip_debug_build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RCBBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-build-reports
          path: app/build/reports/
          retention-days: 14
